<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贸语通 · 外贸与国际物流英语学习平台</title>
<style>
  :root{
    --navy:#12305e; --navy2:#1b4380; --navy3:#0d2449;
    --gold:#c9a227; --gold2:#e3c25c;
    --bg:#f4f6fa; --line:#e3e8f0; --text:#22304a; --muted:#6b7a93;
    --green:#1e8e5a; --red:#c0392b; --orange:#d97e1a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
  .app{display:flex;min-height:100vh;}

  /* ===== 侧边栏 ===== */
  .sidebar{width:220px;background:linear-gradient(180deg,var(--navy3),var(--navy));color:#fff;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:10;}
  .logo{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
  .logo .cn{font-family:"STZhongsong","SimSun",serif;font-size:22px;letter-spacing:3px;color:#fff;}
  .logo .cn b{color:var(--gold2);}
  .logo .en{font-size:10px;letter-spacing:1.6px;color:rgba(255,255,255,.55);margin-top:4px;text-transform:uppercase;}
  .nav{flex:1;padding:14px 0;}
  .nav-item{display:flex;align-items:center;gap:10px;width:100%;padding:12px 20px;background:none;border:none;color:rgba(255,255,255,.72);font-size:14px;cursor:pointer;text-align:left;border-left:3px solid transparent;transition:.15s;}
  .nav-item:hover{color:#fff;background:rgba(255,255,255,.06);}
  .nav-item.active{color:#fff;background:rgba(255,255,255,.1);border-left-color:var(--gold);}
  .nav-item .ico{width:18px;text-align:center;font-size:15px;}
  .nav-item .badge{margin-left:auto;background:var(--gold);color:#fff;font-size:11px;border-radius:10px;padding:1px 7px;}
  .side-footer{padding:14px 20px;font-size:11px;color:rgba(255,255,255,.4);border-top:1px solid rgba(255,255,255,.1);line-height:1.7;}

  /* ===== 主区 ===== */
  .main{margin-left:220px;flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
  .topbar h1{font-size:17px;font-weight:600;color:var(--navy);display:flex;align-items:center;gap:10px;}
  .topbar h1::before{content:"";display:block;width:4px;height:16px;background:var(--gold);border-radius:2px;}
  .top-right{font-size:12px;color:var(--muted);display:flex;gap:14px;align-items:center;}
  .top-right b{color:var(--navy);}
  .content{padding:24px 28px;max-width:1150px;width:100%;}

  /* ===== 通用组件 ===== */
  .card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 1px 3px rgba(18,48,94,.05);margin-bottom:20px;overflow:hidden;}
  .card-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:#fbfcfe;flex-wrap:wrap;gap:8px;}
  .card-head h3{font-size:15px;color:var(--navy);font-weight:600;}
  .card-body{padding:20px;}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-size:13px;cursor:pointer;transition:.15s;}
  .btn:hover{background:var(--navy2);}
  .btn.ghost{background:#fff;color:var(--navy);}
  .btn.ghost:hover{background:#eef3fa;}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#fff;}
  .btn.gold:hover{background:#b8931f;}
  .btn.sm{padding:5px 11px;font-size:12px;}
  .btn.danger{background:#fff;color:var(--red);border-color:var(--red);}
  .btn.danger:hover{background:#fdf0ee;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;background:#eef3fa;color:var(--navy);border:1px solid #d8e2f0;margin:2px 4px 2px 0;}
  .tag.gold{background:#faf5e4;color:#8a6d14;border-color:#e8d9a0;}
  .muted{color:var(--muted);}
  .num{font-family:Georgia,serif;}
  input[type=text],textarea,select{border:1px solid #ccd6e4;border-radius:6px;padding:9px 12px;font-size:13px;font-family:inherit;width:100%;outline:none;background:#fff;color:var(--text);}
  input[type=text]:focus,textarea:focus{border-color:var(--navy2);box-shadow:0 0 0 3px rgba(27,67,128,.1);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{background:#f0f4f9;color:var(--navy);text-align:left;padding:10px 14px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:11px 14px;border-bottom:1px solid #eef1f6;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row-hover:hover td{background:#f8fafd;}
  .icon-btn{background:#eef3fa;border:1px solid #d8e2f0;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--navy);transition:.15s;padding:0;line-height:1;flex:none;}
  .icon-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
  .mini-btn{background:none;border:none;cursor:pointer;font-size:16px;color:#c3ccda;padding:2px 5px;line-height:1;}
  .mini-btn:hover{color:var(--gold);}
  .mini-btn.on{color:var(--gold);}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(13,36,73,.94);color:#fff;padding:10px 20px;border-radius:6px;font-size:13px;z-index:300;max-width:80%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .kbd{display:inline-block;background:#f0f4f9;border:1px solid #d8e2f0;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:11px;font-family:Consolas,monospace;color:var(--navy);}
  @keyframes fadeIn{from{opacity:0}}

  /* ===== 总览 ===== */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;position:relative;overflow:hidden;}
  .stat::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;}
  .stat.s1::before{background:var(--navy);} .stat.s2::before{background:var(--gold);}
  .stat.s3::before{background:var(--green);} .stat.s4::before{background:var(--orange);}
  .stat .label{font-size:12px;color:var(--muted);}
  .stat .val{font-size:30px;font-weight:700;color:var(--navy);margin-top:6px;font-family:Georgia,serif;}
  .stat .sub{font-size:11px;color:var(--muted);margin-top:4px;}
  .task-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px;}
  .task{border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center;background:#fbfcfe;}
  .task .v{font-size:24px;font-weight:700;font-family:Georgia,serif;color:var(--navy);}
  .task .k{font-size:12px;color:var(--muted);margin-top:3px;}
  .task.due .v{color:var(--red);} .task.star .v{color:var(--gold);}
  .task.wrong .v{color:var(--orange);} .task.today .v{color:var(--green);}
  .progress-wrap{margin-top:6px;}
  .bar{height:8px;background:#e8edf4;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy2),var(--gold));border-radius:4px;}
  .empty{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty .big{font-size:38px;margin-bottom:12px;}

  /* ===== 筛选栏 ===== */
  .filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .filter-bar input{max-width:220px;}
  .filter-bar select{width:auto;min-width:120px;}
  .word-term{font-weight:600;color:var(--navy);font-size:14px;}
  .word-phon{color:var(--muted);font-size:12px;font-family:Georgia,serif;}
  .pos-chip{display:inline-block;font-size:11px;color:#8a6d14;background:#faf5e4;border:1px solid #e8d9a0;border-radius:3px;padding:1px 6px;margin-right:6px;font-style:italic;}
  .mastery-dots{letter-spacing:2px;font-size:12px;white-space:nowrap;}
  .mastery-dots .on{color:var(--gold);} .mastery-dots .off{color:#d9dfe8;}

  /* ===== 翻转卡片 ===== */
  .flash-stage{display:flex;flex-direction:column;align-items:center;padding:10px 0;}
  .flash-counter{font-size:12px;color:var(--muted);margin-bottom:14px;text-align:center;line-height:1.9;}
  .flash-card{width:100%;max-width:640px;min-height:300px;background:linear-gradient(160deg,#fff,#f6f9fd);border:2px solid var(--navy);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;cursor:pointer;position:relative;box-shadow:0 6px 18px rgba(18,48,94,.1);}
  .flash-say{position:absolute;top:14px;right:16px;}
  .flash-term{font-size:32px;font-weight:700;color:var(--navy);font-family:Georgia,serif;}
  .flash-phon{color:var(--muted);margin-top:8px;font-family:Georgia,serif;}
  .flash-zh{font-size:22px;color:var(--text);font-weight:600;}
  .flash-def{margin-top:14px;color:var(--muted);font-size:13px;line-height:1.8;max-width:480px;}
  .flash-ex{margin-top:12px;font-size:13px;color:var(--navy2);line-height:1.7;font-style:italic;}
  .flash-btns{display:flex;gap:14px;margin-top:22px;}
  .grade-btn{padding:10px 26px;border-radius:8px;border:none;font-size:14px;cursor:pointer;color:#fff;transition:.15s;}
  .grade-btn:hover{transform:translateY(-1px);filter:brightness(1.08);}
  .g-no{background:var(--red);} .g-mid{background:var(--orange);} .g-yes{background:var(--green);}

  /* ===== 句子 ===== */
  .sent-en{font-size:15px;color:var(--text);line-height:1.7;}
  .sent-zh{font-size:13px;color:var(--muted);line-height:1.7;margin-top:6px;transition:.2s;}
  .scene-chip{display:inline-block;font-size:11px;background:#eef6ef;color:var(--green);border:1px solid #cfe6d4;border-radius:3px;padding:1px 7px;}

  /* ===== 测验 ===== */
  .quiz-opt{display:block;width:100%;text-align:left;padding:14px 18px;margin-bottom:12px;background:#fff;border:1px solid #ccd6e4;border-radius:8px;font-size:14px;cursor:pointer;transition:.12s;color:var(--text);}
  .quiz-opt:hover{border-color:var(--navy2);background:#f6f9fd;}
  .quiz-opt.correct{border-color:var(--green);background:#eef8f2;color:var(--green);font-weight:600;}
  .quiz-opt.wrong{border-color:var(--red);background:#fdf0ee;color:var(--red);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-q{font-size:20px;font-weight:600;color:var(--navy);margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .quiz-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:18px;}
  .score-ring{width:120px;height:120px;border-radius:50%;border:10px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--green);margin:0 auto 16px;font-family:Georgia,serif;}
  .spell-input{max-width:360px;margin:0 auto;display:block;text-align:center;font-size:16px;}
  .dictation-box{text-align:center;padding:10px 0 4px;}

  /* ===== 数据管理 ===== */
  .drop-zone{border:2px dashed #c3d0e2;border-radius:8px;padding:30px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;background:#fbfcfe;}
  .drop-zone:hover,.drop-zone.drag{border-color:var(--navy2);background:#f2f6fc;}
  textarea.code{font-family:Consolas,monospace;font-size:12px;min-height:130px;line-height:1.6;}
  .msg{padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:12px;display:none;}
  .msg.ok{background:#eef8f2;color:var(--green);border:1px solid #cfe6d4;display:block;}
  .msg.err{background:#fdf0ee;color:var(--red);border:1px solid #f0cdc9;display:block;}
  .setting-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .setting-row .lab{width:96px;color:var(--muted);font-size:13px;flex:none;}
  .setting-row select{width:auto;min-width:170px;}
  .setting-row input[type=range]{width:170px;}

  /* ===== 弹窗 ===== */
  .modal-mask{position:fixed;inset:0;background:rgba(13,36,73,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .15s;}
  .modal{background:#fff;border-radius:10px;max-width:660px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2);}
  .modal-head{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fbfcfe;position:sticky;top:0;z-index:2;}
  .modal-head h3{color:var(--navy);font-size:16px;display:flex;align-items:center;gap:10px;}
  .modal-close{border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer;}
  .modal-body{padding:24px;}
  .detail-row{margin-bottom:16px;}
  .detail-row .k{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .detail-row .v{font-size:14px;line-height:1.7;}
  .form-row{margin-bottom:14px;}
  .form-row .k{font-size:12px;color:var(--muted);margin-bottom:5px;}

  /* ===== 悬停查词 ===== */
  .hiword{cursor:help;border-bottom:1px dashed transparent;border-radius:2px;padding:0 1px;transition:background .12s;}
  .hiword.known{border-bottom-color:#cfd9e6;}
  .hiword:hover{background:#fff3cf;border-bottom-color:var(--gold);color:var(--navy3);}
  .dict-pop{position:fixed;z-index:400;display:none;max-width:320px;background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;box-shadow:0 10px 30px rgba(18,48,94,.2);padding:12px 14px;}
  .dict-pop .dw{display:flex;align-items:center;gap:8px;font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--navy);}
  .dict-pop .dterm{cursor:pointer;border-bottom:1px dashed var(--gold);}
  .dict-pop .dterm:hover{color:var(--navy2);background:#fff6d8;}
  .dict-pop .dp{font-family:Georgia,serif;font-size:12px;color:var(--muted);margin-top:3px;}
  .dict-pop .dm{font-size:14px;font-weight:600;color:var(--text);margin-top:8px;line-height:1.6;}
  .dict-pop .dn{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .dict-pop .dmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted);}
  .dict-pop .src{background:#eef3fa;border:1px solid #d8e2f0;border-radius:3px;padding:1px 6px;color:var(--navy);}
  .dict-pop .dok{color:var(--green);}
  .dict-pop .dadd{border:none;background:none;color:var(--navy2);cursor:pointer;font-size:11px;padding:0;text-decoration:underline;font-family:inherit;}
  .dict-pop .dhint{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted);}

  @media (max-width:900px){
    .sidebar{width:64px;} .logo .cn,.logo .en,.nav-item .txt,.nav-item .badge,.side-footer{display:none;}
    .main{margin-left:64px;} .stat-grid,.task-grid{grid-template-columns:repeat(2,1fr);}
    .content{padding:18px 14px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="cn">贸语<b>通</b></div>
      <div class="en">TradeLingo · FT &amp; Logistics English</div>
    </div>
    <nav class="nav">
      <button class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')"><span class="ico">📊</span><span class="txt">学习总览</span></button>
      <button class="nav-item" data-view="words" onclick="switchView('words')"><span class="ico">📖</span><span class="txt">单词学习</span><span class="badge" id="navDue" style="display:none">0</span></button>
      <button class="nav-item" data-view="sentences" onclick="switchView('sentences')"><span class="ico">✉️</span><span class="txt">句子学习</span></button>
      <button class="nav-item" data-view="quiz" onclick="switchView('quiz')"><span class="ico">✏️</span><span class="txt">测验中心</span></button>
      <button class="nav-item" data-view="data" onclick="switchView('data')"><span class="ico">🗂️</span><span class="txt">数据管理</span></button>
    </nav>
    <div class="side-footer">v1.4 · 数据保存在本机浏览器<br>发音由语音合成提供 · 支持悬停查词</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="viewTitle">学习总览</h1>
      <div class="top-right">
        <span>待复习 <b id="topDue">0</b></span>
        <span>词库 <b id="topWords">0</b></span>
        <span>句库 <b id="topSents">0</b></span>
      </div>
    </div>
    <div class="content" id="viewRoot"></div>
  </div>
</div>
<div id="modalRoot"></div>

<script>
/* ================= 工具 ================= */
const STORE_KEY = 'tradelingo_v1';
/* 间隔重复阶梯（天）：level 0 → 6 */
const REVIEW_DAYS = [0, 1, 2, 4, 7, 15, 30];
function uid(p){ return p + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(ts){ const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return fmtDate(Date.now()); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickN(arr,n){ return shuffle([...arr]).slice(0,n); }
function uniq(arr){ return [...new Set(arr)]; }
let _toastTimer=null;
function toast(msg){
  let el = document.getElementById('toastBox');
  if(!el){ el=document.createElement('div'); el.id='toastBox'; el.className='toast'; document.body.appendChild(el); }
  el.textContent = msg; el.style.display='block';
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>{ el.style.display='none'; }, 2200);
}

/* ================= 数据层 ================= */
function emptyDB(){ return { words:[], sentences:[], imports:[], quizLog:[], studyLog:{},
  settings:{ engine:'auto', accent:'us', rate:0.9, autoSpeak:true, hoverDict:true, onlineDict:true } }; }
function loadDB(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(!raw) return emptyDB();
    return Object.assign(emptyDB(), JSON.parse(raw));
  }catch(e){ return emptyDB(); }
}
function saveDB(){ invalidateDictIndex(); try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){ console.warn(e); } }
let DB = loadDB();
/* 兼容旧版本数据 */
function migrate(){
  DB.settings = Object.assign({ engine:'auto', accent:'us', rate:0.9, autoSpeak:true, hoverDict:true, onlineDict:true }, DB.settings||{});
  if(!DB.studyLog) DB.studyLog = {};
  DB.words.forEach(w=>{
    if(w.starred==null) w.starred=false;
    if(w.wrongBook==null) w.wrongBook=false;
    if(w.level==null) w.level = w.mastery||0;
    if(w.nextReviewAt==null) w.nextReviewAt=0;
    if(w.lastReviewAt==null) w.lastReviewAt=0;
  });
  DB.sentences.forEach(s=>{ if(s.starred==null) s.starred=false; });
}

/* ================= 发音模块 ================= */
let _audioEl = null, _onlineDisabled = false;
function hasLocalTTS(){ return typeof window!=='undefined' && 'speechSynthesis' in window; }
function pickVoice(lang){
  if(!hasLocalTTS()) return null;
  let vs = [];
  try{ vs = speechSynthesis.getVoices()||[]; }catch(e){ return null; }
  const norm = l => String(l||'').replace('_','-').toLowerCase();
  return vs.find(v=>norm(v.lang)===lang.toLowerCase())
      || vs.find(v=>norm(v.lang).startsWith(lang.slice(0,2)))
      || null;
}
function speakLocal(text){
  if(!hasLocalTTS()){ toast('当前浏览器不支持本地语音合成'); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = DB.settings.accent==='uk' ? 'en-GB' : 'en-US';
    u.rate = DB.settings.rate; u.pitch = 1; u.volume = 1;
    const v = pickVoice(u.lang); if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){ console.warn(e); }
}
function speakOnline(text, onFail){
  try{
    if(typeof Audio==='undefined'){ if(onFail) onFail(); return; }
    if(!_audioEl) _audioEl = new Audio();
    const type = DB.settings.accent==='uk' ? 1 : 2;
    _audioEl.onerror = ()=>{ if(onFail) onFail(); };
    _audioEl.src = 'https://dict.youdao.com/dictvoice?audio='+encodeURIComponent(text)+'&type='+type;
    const p = _audioEl.play();
    if(p && p.catch) p.catch(()=>{ if(onFail) onFail(); });
  }catch(e){ if(onFail) onFail(); }
}
/* 主发音入口：auto = 在线优先，失败回退本地（5 分钟内不再重试在线） */
function speak(text){
  if(!text) return;
  text = String(text).trim();
  const eng = DB.settings.engine;
  if(eng==='local'){ speakLocal(text); return; }
  if(eng==='online'){ speakOnline(text, ()=>toast('在线发音失败，请检查网络或改用本地语音')); return; }
  if(_onlineDisabled){ speakLocal(text); return; }
  speakOnline(text, ()=>{
    _onlineDisabled = true;
    setTimeout(()=>{ _onlineDisabled=false; }, 5*60*1000);
    speakLocal(text);
  });
}
function speakEl(el){
  if(!el) return;
  try{ if(window.event && window.event.stopPropagation) window.event.stopPropagation(); }catch(e){}
  speak(el.getAttribute('data-say'));
}
function previewVoice(){ speak('Bill of Lading'); }

const COMMON_DICT = {};
COMMON_RAW.split('\n').forEach(line=>{
  const t = line.trim(); if(!t) return;
  const p = t.split('|'); if(p.length<4) return;
  COMMON_DICT[p[0].trim().toLowerCase()] = {
    term:p[0].trim(), phonetic:p[1].trim(), pos:p[2].trim(), zh:p[3].trim(), from:'builtin' };
});

function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
/* 词形还原候选：词库里有原形时，cartons / shipped / quantities 也能查到 */
function lemmaVariants(w){
  const s = String(w).toLowerCase(), out = [s];
  const add = (x,min)=>{ const n=min==null?3:min; if(x && x.length>=n && out.indexOf(x)<0) out.push(x); };
  if(s.slice(-2)==="'s" || s.slice(-2)==='’s') add(s.slice(0,-2), 2);
  if(/ies$/.test(s)) add(s.slice(0,-3)+'y');
  if(/es$/.test(s)) add(s.slice(0,-2));
  if(/s$/.test(s)) add(s.slice(0,-1));
  if(/ing$/.test(s)){ const b=s.slice(0,-3); add(b,2); add(b+'e',2); if(/([bdgklmnprt])\1$/.test(b)) add(b.slice(0,-1),2); }
  if(/ed$/.test(s)){ const b=s.slice(0,-2); add(b); add(b+'e'); if(/([bdgklmnprt])\1$/.test(b)) add(b.slice(0,-1)); if(/i$/.test(b)) add(b.slice(0,-1)+'y'); }
  return out;
}
/* 查词索引：内置库打底，用户词库覆盖（用户词库优先） */
let _dictIdx = null, _dictPhrases = null;
function invalidateDictIndex(){ _dictIdx = null; _dictPhrases = null; }
function dictIndex(){
  if(_dictIdx) return _dictIdx;
  const m = Object.assign({}, COMMON_DICT);
  DB.words.forEach(w=>{
    const k = String(w.term||'').toLowerCase().trim(); if(!k) return;
    m[k] = { term:w.term, phonetic:w.phonetic||'', pos:w.pos||'', zh:w.translation||'', def:w.definition||'', from:'db' };
  });
  _dictIdx = m; return m;
}
/* 需要整段匹配的词条（含空格 / 斜杠 / 连字符） */
function phraseEntries(){
  if(_dictPhrases) return _dictPhrases;
  const idx = dictIndex();
  _dictPhrases = Object.keys(idx).filter(k=>/[\s\/\-]/.test(k))
    .sort((a,b)=> b.length - a.length)
    .map(k=>({ term: idx[k].term, key:k }));
  return _dictPhrases;
}
/* 本地查词：精确 → 词形还原 */
function lookupLocal(word){
  const idx = dictIndex();
  const w = String(word==null?'':word).toLowerCase().trim();
  if(!w) return null;
  const vars = lemmaVariants(w);
  for(let i=0;i<vars.length;i++){
    const hit = idx[vars[i]];
    if(hit){ const o = Object.assign({}, hit); o.matched = vars[i]; if(vars[i]!==w) o.lemma = vars[i]; return o; }
  }
  return null;
}
/* 把英文文本渲染为可悬停查词的 HTML（词组优先整段匹配） */
function enHTML(text){
  const raw = String(text==null?'':text);
  if(!raw) return '';
  if(!DB.settings.hoverDict) return esc(raw);
  let s = raw;
  const marks = [];
  phraseEntries().forEach(ph=>{
    const pat = reEsc(ph.term).replace(/[\s\u00a0]+/g,'[\\s\\u00a0\\-]+');
    const re = new RegExp('(^|[^A-Za-z])(' + pat + ')(?![A-Za-z])','gi');
    s = s.replace(re, (m,p1)=>{ marks.push(m.slice(p1.length)); return p1 + '\u0001' + (marks.length-1) + '\u0001'; });
  });
  s = esc(s).replace(/[A-Za-z][A-Za-z'’\-]*/g, m=>{
    const e = lookupLocal(m);
    return '<span class="hiword' + (e && e.from==='db' ? ' known' : '') + '" data-w="' + esc(m) + '">' + m + '</span>';
  });
  s = s.replace(/\u0001(\d+)\u0001/g, (m,i)=>{
    const w = marks[+i], e = lookupLocal(w);
    return '<span class="hiword phrase' + (e && e.from==='db' ? ' known' : '') + '" data-w="' + esc(w) + '">' + esc(w) + '</span>';
  });
  return s;
}
/* 在线词典兜底（结果缓存到本机，两次失败后 5 分钟内不再请求） */
const DICT_CACHE_KEY = 'tradelingo_dict_v1';
let dictCache = {}; try{ dictCache = JSON.parse(localStorage.getItem(DICT_CACHE_KEY)||'{}')||{}; }catch(e){ dictCache = {}; }
let _dictSeq = 0, _dictFail = 0, _dictBlockUntil = 0;
function saveDictCache(){ try{ localStorage.setItem(DICT_CACHE_KEY, JSON.stringify(dictCache)); }catch(e){} }
function fetchJSON(url, ms){
  return new Promise(resolve=>{
    if(typeof fetch!=='function'){ resolve(null); return; }
    let ctl = null, timer = null;
    try{ ctl = new AbortController(); timer = setTimeout(()=>{ try{ ctl.abort(); }catch(e){} }, ms||6000); }catch(e){}
    fetch(url, ctl?{ signal:ctl.signal } : undefined)
      .then(r=> r && r.ok ? r.json() : null).catch(()=>null).then(j=>{ clearTimeout(timer); resolve(j||null); });
  });
}
function lookupOnline(word, cb){
  const key = String(word==null?'':word).toLowerCase().trim();
  if(!key){ cb(null); return; }
  if(dictCache[key]){ cb(dictCache[key]); return; }
  if(!DB.settings.onlineDict || Date.now() < _dictBlockUntil || typeof fetch!=='function'){ cb(null); return; }
  const seq = ++_dictSeq, out = { term: word, from:'online' };
  Promise.all([
    fetchJSON('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(key)),
    fetchJSON('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(key) + '&langpair=en|zh-CN')
  ]).then(([d1,d2])=>{
    if(seq !== _dictSeq) return;
    try{
      if(Array.isArray(d1) && d1[0]){
        const o = d1[0];
        out.phonetic = o.phonetic || ((o.phonetics||[]).map(p=>p.text).filter(Boolean)[0] || '');
        const m = (o.meanings||[])[0];
        if(m){ out.pos = m.partOfSpeech || ''; out.def = (m.definitions||[]).map(x=>x.definition).filter(Boolean).slice(0,2).join('；'); }
      }
      let zh = d2 && d2.responseData && d2.responseData.translatedText;
      if(zh && d2.responseStatus === 200){
        zh = String(zh).replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').trim();
        const pm = zh.match(/^(n|vt|vi|v|adj|adv|prep|conj|pron|num|art|abbr|int)\.[\s、,]*/i);
        if(pm){ out.pos = out.pos || pm[1].toLowerCase(); zh = zh.slice(pm[0].length); }
        if(zh && zh.toLowerCase() !== key) out.zh = zh;
      }
    }catch(e){}
    if(!out.zh && !out.def){ _dictFail++; if(_dictFail>=2) _dictBlockUntil = Date.now()+5*60000; cb(null); return; }
    _dictFail = 0; dictCache[key] = out; saveDictCache(); cb(out);
  }).catch(()=>cb(null));
}

let _popTimer = null, _popWord = '', _popEntry = null;
const POP_HIDE_DELAY = 450;   /* 离开后延迟隐藏，留出把鼠标移到卡片上的时间 */
function scheduleHidePop(){ clearTimeout(_popTimer); _popTimer = setTimeout(hideDictPop, POP_HIDE_DELAY); }
function dictPopEl(){
  let el = document.getElementById('dictPop');
  if(!el){
    el = document.createElement('div'); el.id='dictPop'; el.className='dict-pop';
    el.onmouseenter = ()=>{ clearTimeout(_popTimer); };
    el.onmouseleave = ()=>{ scheduleHidePop(); };
    document.body.appendChild(el);
  }
  return el;
}
function positionPop(el, ev){
  const pad = 10, w = el.offsetWidth || 240, h = el.offsetHeight || 120;
  const cx = (ev && ev.clientX) || 0, cy = (ev && ev.clientY) || 0;
  let x = cx + 14, y = cy + 16;
  if(x + w > window.innerWidth - pad) x = Math.max(pad, cx - w - 14);
  if(y + h > window.innerHeight - pad) y = Math.max(pad, cy - h - 12);
  el.style.left = x + 'px'; el.style.top = y + 'px';
}
function hideDictPop(){
  clearTimeout(_popTimer); _popWord = '';
  const el = document.getElementById('dictPop'); if(el) el.style.display = 'none';
}
function showDictPop(word, ev){
  if(!DB.settings.hoverDict) return;
  const q = String(word==null?'':word).trim(); if(!q) return;
  const el = dictPopEl();
  clearTimeout(_popTimer);
  if(_popWord === q.toLowerCase() && el.style.display === 'block'){ positionPop(el, ev); return; }
  _popWord = q.toLowerCase();
  const local = lookupLocal(q);
  if(local){
    local.query = q; _popEntry = local; renderDictPop(local);
    el.style.display = 'block'; positionPop(el, ev);
    return;
  }
  _popEntry = null;
  el.innerHTML = '<div class="dw"><span>' + esc(q) + '</span></div><div class="dn">正在查询…</div>';
  el.style.display = 'block'; positionPop(el, ev);
  const cur = _popWord;
  lookupOnline(q, data=>{
    if(_popWord !== cur) return;
    const e = data ? Object.assign({ term:q }, data) : { term:q, zh:'', from:'miss' };
    _popEntry = e; renderDictPop(e); positionPop(el, ev);
  });
}

/* ================= 导入解析（宽容匹配 AI 输出） ================= */
function pick(o, keys){ for(const k of keys){ if(o[k]!=null && String(o[k]).trim()!=='') return o[k]; } return ''; }
function normalizeImport(json){
  let src = json;
  if(Array.isArray(json)) src = { words: json };
  if(!src || typeof src!=='object') throw new Error('数据格式不正确：应为 JSON 对象或数组');
  const meta = src.meta || src.info || {};
  const wRaw = src.words || src.vocabulary || src.wordList || [];
  const sRaw = src.sentences || src.phrases || src.sentenceList || [];
  if(!Array.isArray(wRaw) && !Array.isArray(sRaw)) throw new Error('未找到 words 或 sentences 数组');
  const words = [], sentences = [];
  wRaw.forEach(w=>{
    if(!w || typeof w!=='object') return;
    const term = String(pick(w,['term','word','english','en','headword'])).trim();
    if(!term) return;
    let tags = pick(w,['tags','tag','labels']);
    if(typeof tags==='string') tags = tags.split(/[,，;；\/、\s]+/).filter(Boolean);
    if(!Array.isArray(tags)) tags=[];
    words.push({
      id: uid('w_'), term: term,
      phonetic: String(pick(w,['phonetic','phonetic_en','ipa'])),
      pos: String(pick(w,['pos','partOfSpeech','type'])),
      translation: String(pick(w,['translation','zh','chinese','meaning','cn'])),
      definition: String(pick(w,['definition','explain','note','desc'])),
      exampleEn: String(pick(w,['exampleEn','example','example_en','sentence'])),
      exampleZh: String(pick(w,['exampleZh','example_zh','example_cn'])),
      tags: tags.map(String),
      mastery:0, level:0, starred:false, wrongBook:false,
      right:0, wrong:0, addedAt:Date.now(), lastReviewAt:0, nextReviewAt:0
    });
  });
  sRaw.forEach(s=>{
    if(!s || typeof s!=='object') return;
    const en = String(pick(s,['en','english','sentence','text'])).trim();
    if(!en) return;
    sentences.push({
      id: uid('s_'), en: en,
      zh: String(pick(s,['zh','chinese','cn','translation'])),
      scene: String(pick(s,['scene','scenario','category','type'])),
      notes: String(pick(s,['notes','note','tip'])),
      mastery:0, starred:false, addedAt:Date.now()
    });
  });
  return { words, sentences, meta };
}
function applyImport(parsed){
  const exist = new Set(DB.words.map(w=>w.term.toLowerCase()));
  let nw=0, dup=0;
  parsed.words.forEach(w=>{
    if(exist.has(w.term.toLowerCase())){ dup++; return; }
    DB.words.push(w); exist.add(w.term.toLowerCase()); nw++;
  });
  const existS = new Set(DB.sentences.map(s=>s.en.toLowerCase()));
  let ns=0;
  parsed.sentences.forEach(s=>{
    if(existS.has(s.en.toLowerCase())) return;
    DB.sentences.push(s); existS.add(s.en.toLowerCase()); ns++;
  });
  DB.imports.unshift({ id:uid('i_'), title: parsed.meta.title||'未命名批次', category: parsed.meta.category||'—',
    source: parsed.meta.source||'—', date: Date.now(), words:nw, sentences:ns, duplicates:dup });
  saveDB();
  return {nw, ns, dup};
}

/* ================= 学习调度（间隔重复） ================= */
function recordStudy(){
  const k = todayKey();
  DB.studyLog[k] = (DB.studyLog[k]||0) + 1;
}
/* quality: 1 认识 / 0 模糊 / -1 不认识 */
function schedule(w, quality){
  if(quality>0) w.level = Math.min(6,(w.level||0)+1);
  else if(quality<0) w.level = 0;
  const days = REVIEW_DAYS[w.level]!=null ? REVIEW_DAYS[w.level] : 30;
  const base = quality>0 ? Math.max(days,1)*86400000
             : quality<0 ? 10*60000
             : 12*3600000;
  w.nextReviewAt = Date.now() + base;
  w.lastReviewAt = Date.now();
  w.mastery = Math.min(5, w.level);
  recordStudy();
}
function dueWords(){ return DB.words.filter(w=>w.lastReviewAt && w.nextReviewAt<=Date.now()); }
function lowWords(n){ return [...DB.words].sort((a,b)=>(a.level-b.level)||(a.wrong-b.wrong)).slice(0,n||15); }

let _wt=null; function renderWordsDebounced(){ clearTimeout(_wt); _wt=setTimeout(renderWords,250); }
/* 当前筛选条件下的单词列表（供渲染与导出共用） */
function filteredWords(){
  const q = wordFilter.q.toLowerCase();
  const dueIds = new Set(dueWords().map(w=>w.id));
  return DB.words.filter(w=>{
    if(wordFilter.tag!=='全部' && !w.tags.includes(wordFilter.tag)) return false;
    if(wordFilter.scope==='未掌握' && w.mastery>=4) return false;
    if(wordFilter.scope==='生词本' && !w.starred) return false;
    if(wordFilter.scope==='错题本' && !w.wrongBook) return false;
    if(wordFilter.scope==='待复习' && !dueIds.has(w.id)) return false;
    if(q && !(w.term.toLowerCase().includes(q)||w.translation.toLowerCase().includes(q))) return false;
    return true;
  });
}

function toggleStar(kind, id){

  saveDB(); render();
}

      <button class="btn ghost sm" onclick="wordFilter.mode='list';flash=null;renderWords()">退出卡片模式</button>
    </div>
  </div>`;
  if(!f.showZh) autoSpeakAfter(w);
}
function toggleFlashStar(id){ const w=DB.words.find(x=>x.id===id); if(!w) return; w.starred=!w.starred; saveDB(); renderFlash(); }
function flipCard(){ if(flash){ flash.showZh=true; renderFlash(); } }
function gradeCard(v){
  if(!flash) return;
  const w = flash.list[flash.idx];
  if(v>0){ w.right++; w.wrongBook=false; schedule(w,1); }
  else if(v<0){ w.wrong++; w.wrongBook=true; schedule(w,-1); }
  else { schedule(w,0); }
  saveDB(); updateTop();
  flash.idx++; flash.showZh=false;
  renderFlash();
}

let quiz = null;
function renderQuizHome(){
  const root = document.getElementById('viewRoot');
  if(DB.words.length<4){
    root.innerHTML = `<div class="card"><div class="card-body"><div class="empty">
      <div class="big">✏️</div><p>词库中至少需要 4 个单词才能生成测验。</p></div></div></div>`;

  }

  <div class="card"><div class="card-head"><h3>开始一次测验</h3></div>
  <div class="card-body">
    <p class="muted" style="margin-bottom:16px;line-height:1.9">
      <b>综合测验</b>：英译中选择、中译英选择、单词拼写混合出题。<br>
      <b>听写测验</b>：听发音写下单词，自动优先抽查薄弱词。<br>
      答对提升掌握等级并延长复习间隔，答错记入错题本并缩短间隔。</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span>题量：</span>
      <select id="quizCount" style="width:100px">
        <option value="5">5 题</option><option value="10" selected>10 题</option><option value="15">15 题</option><option value="20">20 题</option>
      </select>
      <button class="btn gold" onclick="startQuiz()">✏️ 综合测验</button>
      <button class="btn" onclick="startDictation()">🎧 听写测验</button>
      <button class="btn ghost" onclick="startReview()">🔁 复习到期单词</button>
    </div>
  </div></div>
  ${DB.quizLog.length?`<div class="card"><div class="card-head"><h3>历史成绩</h3></div>
    <table><thead><tr><th>日期</th><th>类型</th><th>题量</th><th>得分</th><th>正确率</th></tr></thead><tbody>
    ${DB.quizLog.slice(0,10).map(q=>`<tr class="row-hover"><td>${fmtDate(q.date)}</td><td>${q.mode==='dictation'?'听写':'综合'}</td><td class="num">${q.total}</td><td class="num">${q.score}</td><td class="num" style="color:${q.score/q.total>=0.6?'var(--green)':'var(--red)'}">${Math.round(q.score/q.total*100)}%</td></tr>`).join('')}
    </tbody></table></div>`:''}`;
}
function getCount(){
  const el = document.getElementById('quizCount');
  return el ? parseInt(el.value,10) : 10;
}
function quizPool(n){
  const weak = lowWords(Math.max(n*3, 20));
  const weakIds = new Set(weak.map(w=>w.id));
  const rest = shuffle(DB.words.filter(w=>!weakIds.has(w.id)));
  return shuffle([...pickN(weak, Math.max(n*2, n)), ...rest]).slice(0,n);
}
function startQuiz(){
  const n = Math.min(getCount(), DB.words.length);
  const words = quizPool(n);
  const qs = words.map(w=>{
    const others = DB.words.filter(x=>x.id!==w.id && x.translation);
    if(!w.translation || others.length<3) return { type:'spell', w };
    const r = Math.random();
    if(r<0.4) return { type:'e2z', w, opts: shuffle([w.translation, ...pickN(others,3).map(x=>x.translation)]) };
    if(r<0.75) return { type:'z2e', w, opts: shuffle([w.term, ...pickN(DB.words.filter(x=>x.id!==w.id),3).map(x=>x.term)]) };
    return { type:'spell', w };
  });
  quiz = { qs, idx:0, score:0, answered:false, mode:'mixed' };
  renderQuizQ();
}
function startDictation(){
  const n = Math.min(getCount(), DB.words.length);
  const words = quizPool(n);
  quiz = { qs: words.map(w=>({type:'dictation', w, hint:false})), idx:0, score:0, answered:false, mode:'dictation' };
  renderQuizQ();
}
function renderQuizQ(){
  const root = document.getElementById('viewRoot');
  const q = quiz.qs[quiz.idx];
  if(!q){ renderQuizResult(); return; }
  let body='';
  if(q.type==='e2z'){
    body = `<div class="quiz-q">${esc(q.w.term)}
        <button class="icon-btn" data-say="${esc(q.w.term)}" onclick="speakEl(this)">🔊</button></div>
      ${q.w.phonetic?`<div class="word-phon" style="margin-bottom:14px">${esc(q.w.phonetic)}</div>`:'<div style="margin-bottom:14px"></div>'}
      ${q.opts.map((o,i)=>`<button class="quiz-opt" id="opt${i}" onclick="answerOpt(${i})"><b class="num">${i+1}.</b> ${esc(o)}</button>`).join('')}`;
  } else if(q.type==='z2e'){
    body = `<div class="quiz-q" style="font-family:inherit">${esc(q.w.translation)}</div>
      <div style="margin-bottom:14px" class="muted">请选择对应的英文表达</div>
      ${q.opts.map((o,i)=>`<button class="quiz-opt" id="opt${i}" onclick="answerOpt(${i})"><b class="num">${i+1}.</b> ${esc(o)}</button>`).join('')}`;
  } else if(q.type==='spell'){
    const hint = q.w.term.replace(/[A-Za-z']/g,'_').split('').join(' ');
    body = `<div class="quiz-q" style="font-family:inherit">${esc(q.w.translation)}</div>
      <div class="muted" style="margin-bottom:14px">请拼写对应的英文单词（${q.w.term.length} 个字母）<br><span style="letter-spacing:3px;font-family:Georgia,serif">${hint}</span></div>
      <form onsubmit="submitSpell(event)"><input type="text" class="spell-input" id="spellInput" autocomplete="off" placeholder="输入英文并回车">
      <div style="text-align:center;margin-top:14px"><button class="btn" type="submit">提交答案</button></div></form>`;
  } else {
    body = `<div class="dictation-box">
        <div class="muted" style="margin-bottom:10px">听发音，写出对应单词</div>
        <button class="btn gold" style="font-size:15px;padding:12px 30px" data-say="${esc(q.w.term)}" onclick="speakEl(this)">🔊 播放发音</button>
        <div style="font-size:19px;font-weight:600;color:var(--navy);margin:18px 0 6px">${esc(q.w.translation)}</div>
        ${q.hint?`<div class="muted" style="font-family:Georgia,serif;letter-spacing:2px">${esc(q.w.term.replace(/[A-Za-z']/g,'_').split('').join(' '))}</div>`:''}
        <form onsubmit="submitSpell(event)" style="margin-top:14px">
          <input type="text" class="spell-input" id="spellInput" autocomplete="off" placeholder="输入你听到的单词并回车">
          <div style="margin-top:12px;display:flex;gap:10px;justify-content:center">
            <button class="btn" type="submit">提交答案</button>
            <button class="btn ghost" type="button" onclick="quiz.qs[quiz.idx].hint=true;renderQuizQ()">显示提示</button>
          </div>
        </form>
      </div>`;
  }
  root.innerHTML = `
  <div class="card"><div class="card-body">
    <div class="quiz-meta"><span>${quiz.mode==='dictation'?'🎧 听写测验':'✏️ 综合测验'} · 第 <b class="num">${quiz.idx+1}</b> / ${quiz.qs.length} 题</span><span>当前得分 <b class="num">${quiz.score}</b></span></div>
    ${body}
    <div id="quizNext" style="margin-top:16px;text-align:right;display:none">
      <button class="btn gold" onclick="nextQ()">下一题 →</button>
      <span class="muted" style="font-size:11px;margin-left:10px"><span class="kbd">Enter</span> 继续</span>
    </div>
  </div></div>`;
  const si = document.getElementById('spellInput'); if(si) si.focus();
  if(q.type==='dictation' && DB.settings.autoSpeak) setTimeout(()=>speak(q.w.term), 300);
}
function answerOpt(i){
  if(quiz.answered) return;
  const q = quiz.qs[quiz.idx];
  const correctIdx = q.opts.indexOf(q.type==='e2z' ? q.w.translation : q.w.term);
  quiz.answered = true;
  document.querySelectorAll('.quiz-opt').forEach((b,idx)=>{ b.disabled=true; if(idx===correctIdx) b.classList.add('correct'); });
  if(i!==correctIdx){ document.getElementById('opt'+i).classList.add('wrong'); gradeWord(q.w,false); }
  else { quiz.score++; gradeWord(q.w,true); }
  showNext();
}
function submitSpell(e){
  e.preventDefault();
  if(quiz.answered) return;
  const q = quiz.qs[quiz.idx];
  const inp = document.getElementById('spellInput');
  const val = (inp.value||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(!val) return;
  quiz.answered = true;
  const ok = val === q.w.term.toLowerCase().replace(/\s+/g,' ');
  inp.disabled = true;
  inp.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
  inp.insertAdjacentHTML('afterend', `<div style="text-align:center;margin-top:10px;font-weight:600;color:${ok?'var(--green)':'var(--red)'}">
    ${ok?'✅ 回答正确':'❌ 正确答案：'+esc(q.w.term)}
    <button class="icon-btn" style="margin-left:8px" data-say="${esc(q.w.term)}" onclick="speakEl(this)">🔊</button></div>`);
  if(ok){ quiz.score++; gradeWord(q.w,true); } else gradeWord(q.w,false);
  showNext();
}
function showNext(){ const n=document.getElementById('quizNext'); if(n) n.style.display='block'; }
function nextQ(){ quiz.idx++; quiz.answered=false; renderQuizQ(); }
function gradeWord(w, ok){
  if(ok){ w.right++; w.wrongBook=false; schedule(w,1); }
  else { w.wrong++; w.wrongBook=true; schedule(w,-1); }
  saveDB(); updateTop();
}
function renderQuizResult(){
  const root = document.getElementById('viewRoot');
  const pct = Math.round(quiz.score/quiz.qs.length*100);
  const ringColor = pct>=80?'var(--green)':pct>=60?'var(--gold)':'var(--red)';
  const mode = quiz.mode;
  DB.quizLog.unshift({date:Date.now(), total:quiz.qs.length, score:quiz.score, mode:mode});
  DB.quizLog = DB.quizLog.slice(0,50);
  saveDB(); updateTop();
  root.innerHTML = `
  <div class="card"><div class="card-body" style="text-align:center;padding:44px">
    <div class="score-ring" style="border-color:${ringColor};color:${ringColor}">${pct}%</div>
    <div style="font-size:17px;font-weight:600;margin-bottom:6px">${mode==='dictation'?'听写':'综合'}测验完成！</div>
    <p class="muted">得分 ${quiz.score} / ${quiz.qs.length} ${pct>=80?'· 表现优秀 🎉':pct>=60?'· 继续加油':'· 建议先复习卡片再测'}</p>
    <div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button class="btn gold" onclick="${mode==='dictation'?'startDictation()':'startQuiz()'}">再来一次</button>
      <button class="btn ghost" onclick="renderQuizHome()">返回测验中心</button>
      <button class="btn ghost" onclick="startReview()">复习到期/错题单词</button>
    </div>
  </div></div>`;
  quiz = null;
}

        词组会整段识别（如 Bill of Lading、Letter of Credit、L/C）。词义卡片上的「＋ 加入词库」可把生词直接收进词库。</p>

  </div>

  <div class="card">
    <div class="card-head"><h3>备份与恢复</h3></div>
    <div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap">

function updateExportPreview(){
  const el = document.getElementById('expPreview');

/* ================= 导出（单词 / 句子） ================= */
function csvCell(v){ const s = String(v==null?'':v); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function toCSV(rows){ return rows.map(r=>r.map(csvCell).join(',')).join('\r\n'); }
function mdTable(rows){
  if(!rows.length) return '';
  return '| ' + rows[0].join(' | ') + ' |\n| ' + rows[0].map(()=>'---').join(' | ') + ' |\n'
       + rows.slice(1).map(r=>'| ' + r.join(' | ') + ' |').join('\n');
}
function wordHeader(detail, progress){
  const h = ['单词'];
  if(detail) h.push('音标','词性','中文释义','详解','英文例句','例句翻译','标签');
  if(progress) h.push('掌握等级','答对','答错','下次复习','加入日期');
  return h;
}
function wordRow(w, detail, progress){
  const r = [w.term];
  if(detail) r.push(w.phonetic, w.pos, w.translation, w.definition, w.exampleEn, w.exampleZh, w.tags.join(' '));
  if(progress) r.push('Lv.'+w.level, w.right, w.wrong, w.nextReviewAt>Date.now()?fmtDate(w.nextReviewAt):'待复习', fmtDate(w.addedAt));
  return r;
}
function wordObj(w, detail, progress){
  const o = detail
    ? { term:w.term, phonetic:w.phonetic, pos:w.pos, translation:w.translation, definition:w.definition,
        exampleEn:w.exampleEn, exampleZh:w.exampleZh, tags:w.tags }
    : { term:w.term, translation:w.translation };
  if(progress){ o.level = w.level; o.right = w.right; o.wrong = w.wrong; o.nextReviewAt = w.nextReviewAt; o.addedAt = w.addedAt; }
  return o;
}
function sentHeader(detail, progress){
  const h = ['英文句子','中文翻译'];
  if(detail) h.push('场景','语言点');
  if(progress) h.push('收藏','掌握','加入日期');
  return h;
}
function sentRow(s, detail, progress){
  const r = [s.en, s.zh];
  if(detail) r.push(s.scene, s.notes);
  if(progress) r.push(s.starred?'是':'否', s.mastery>=2?'已掌握':'未掌握', fmtDate(s.addedAt));
  return r;
}
function sentObj(s, detail, progress){
  const o = detail ? { en:s.en, zh:s.zh, scene:s.scene, notes:s.notes } : { en:s.en, zh:s.zh };
  if(progress){ o.starred = s.starred; o.mastery = s.mastery; o.addedAt = s.addedAt; }
  return o;
}
function buildExportText(kind, list, fmt, detail, progress){
  if(fmt==='json') return JSON.stringify(list.map(x=> kind==='words'? wordObj(x,detail,progress) : sentObj(x,detail,progress)), null, 2);
  const header = kind==='words' ? wordHeader(detail,progress) : sentHeader(detail,progress);
  const rows = [header, ...list.map(x=> kind==='words'? wordRow(x,detail,progress) : sentRow(x,detail,progress))];
  if(fmt==='csv') return '\uFEFF' + toCSV(rows);
  if(fmt==='md') return '# 贸语通导出（' + todayKey() + '）\n\n' + mdTable(rows) + '\n';
  /* txt：纯词表 */
  return list.map(x=>{
    const a = kind==='words' ? x.term : x.en;
    const b = kind==='words' ? x.translation : x.zh;
    if(!detail) return a;
    const extra = kind==='words' && x.phonetic ? ' ' + x.phonetic : '';
    return a + extra + '\t' + b;
  }).join('\r\n');
}
const EXP_MIME = { csv:'text/csv', txt:'text/plain', md:'text/markdown', json:'application/json' };
function doExport(kind, list, fmt, detail, progress){
  if(!list.length){ toast('该范围内没有可导出的内容'); return; }
  const text = buildExportText(kind, list, fmt, detail, progress);
  download('tradelingo-' + kind + '-' + fmtDate(Date.now()) + '.' + fmt, text, (EXP_MIME[fmt]||'text/plain') + ';charset=utf-8');
  toast('已导出 ' + list.length + ' 条（' + fmt.toUpperCase() + '）');
}
function expRangeWords(){
  const el = document.getElementById('expRange');
  const r = el ? el.value : 'all';
  const dueIds = new Set(dueWords().map(w=>w.id));
  if(r==='due') return DB.words.filter(w=>dueIds.has(w.id));
  if(r==='star') return DB.words.filter(w=>w.starred);
  if(r==='wrong') return DB.words.filter(w=>w.wrongBook);
  if(r==='new') return DB.words.filter(w=>w.level<4);
  if(r==='mastered') return DB.words.filter(w=>w.level>=4);
  return [...DB.words];
}
function exportWordsFromUI(){
  const fmt = document.getElementById('expFormat').value;
  const detail = document.getElementById('expDetail').checked;
  const progress = document.getElementById('expProgress').checked;

}
function exportSentencesFromUI(){

function setSetting(k,v){ DB.settings[k]=v; saveDB(); }
function onRateChange(el){

function importMsg(ok, text){
  const el = document.getElementById('importMsg');
  if(!el){ toast(text); return; }
  el.className = 'msg '+(ok?'ok':'err');
  el.textContent = text;
  try{ el.scrollIntoView({behavior:'smooth', block:'nearest'}); }catch(e){}
}
function handleFile(f){
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{ doImport(JSON.parse(reader.result)); }
    catch(e){ importMsg(false, '导入失败：'+e.message+'（请确认是合法 JSON，且包含 words / sentences 数组）'); }
  };
  reader.readAsText(f,'UTF-8');
}
function importPaste(){
  try{ doImport(JSON.parse(document.getElementById('pasteArea').value)); }
  catch(e){ importMsg(false, '导入失败：'+e.message); }
}
function doImport(json){
  try{
    const parsed = normalizeImport(json);
    if(parsed.words.length+parsed.sentences.length===0){ importMsg(false,'导入失败：未解析到有效的单词或句子条目'); return; }
    const r = applyImport(parsed);
    renderData(); updateTop();
    importMsg(true, `✅ 导入成功：新增 ${r.nw} 个单词、${r.ns} 个句子${r.dup?`，自动去重 ${r.dup} 个重复单词`:''}`);
  }catch(e){ importMsg(false, '导入失败：'+e.message); }
}
function download(filename, text, mime){
  const blob = new Blob([text], {type: mime || 'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

/* ================= 键盘快捷键 ================= */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); return; }
  if(document.getElementById('modalRoot').innerHTML) return;
  const tag = String((e.target && e.target.tagName) || '').toLowerCase();
  if(tag==='input' || tag==='textarea'){
    if(e.key==='Enter' && quiz && quiz.answered && currentView==='quiz'){ e.preventDefault(); nextQ(); }
    return;
  }
  if(currentView==='words' && flash){
    if(e.code==='Space'){ e.preventDefault(); if(!flash.showZh) flipCard(); else gradeCard(1); return; }
    if(e.key==='1'){ e.preventDefault(); if(flash.showZh) gradeCard(-1); else flipCard(); return; }
    if(e.key==='2'){ e.preventDefault(); if(flash.showZh) gradeCard(0); return; }
    if(e.key==='3'){ e.preventDefault(); if(flash.showZh) gradeCard(1); return; }
    return;
  }
  if(currentView==='quiz' && quiz){
    const q = quiz.qs[quiz.idx];
    if(q && !quiz.answered && q.opts){
      const n = parseInt(e.key,10);
      if(n>=1 && n<=q.opts.length){ e.preventDefault(); answerOpt(n-1); }
      return;
    }
    if(quiz.answered && e.key==='Enter'){ e.preventDefault(); nextQ(); }
  }
});
