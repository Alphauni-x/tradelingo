/* ================= 导出（单词 / 句子） ================= */
function csvCell(v){ const s = String(v==null?'':v); return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function toCSV(rows){ return rows.map(r=>r.map(csvCell).join(',')).join('\r\n'); }
function mdTable(rows){
  if(!rows.length) return '';
  return '| ' + rows[0].join(' | ') + ' |\n| ' + rows[0].map(()=>'---').join(' | ') + ' |\n'
       + rows.slice(1).map(r=>'| ' + r.join(' | ') + ' |').join('\n');
}
function wordHeader(detail, progress){
  const h = ['单词'];
  if(detail) h.push('音标','词性','中文释义','详解','英文例句','例句翻译','标签');
  if(progress) h.push('掌握等级','答对','答错','下次复习','加入日期');
  return h;
}
function wordRow(w, detail, progress){
  const r = [w.term];
  if(detail) r.push(w.phonetic, w.pos, w.translation, w.definition, w.exampleEn, w.exampleZh, w.tags.join(' '));
  if(progress) r.push('Lv.'+w.level, w.right, w.wrong, w.nextReviewAt>Date.now()?fmtDate(w.nextReviewAt):'待复习', fmtDate(w.addedAt));
  return r;
}
function wordObj(w, detail, progress){
  const o = detail
    ? { term:w.term, phonetic:w.phonetic, pos:w.pos, translation:w.translation, definition:w.definition,
        exampleEn:w.exampleEn, exampleZh:w.exampleZh, tags:w.tags }
    : { term:w.term, translation:w.translation };
  if(progress){ o.level = w.level; o.right = w.right; o.wrong = w.wrong; o.nextReviewAt = w.nextReviewAt; o.addedAt = w.addedAt; }
  return o;
}
function sentHeader(detail, progress){
  const h = ['英文句子','中文翻译'];
  if(detail) h.push('场景','语言点');
  if(progress) h.push('收藏','掌握','加入日期');
  return h;
}
function sentRow(s, detail, progress){
  const r = [s.en, s.zh];
  if(detail) r.push(s.scene, s.notes);
  if(progress) r.push(s.starred?'是':'否', s.mastery>=2?'已掌握':'未掌握', fmtDate(s.addedAt));
  return r;
}
function sentObj(s, detail, progress){
  const o = detail ? { en:s.en, zh:s.zh, scene:s.scene, notes:s.notes } : { en:s.en, zh:s.zh };
  if(progress){ o.starred = s.starred; o.mastery = s.mastery; o.addedAt = s.addedAt; }
  return o;
}
function buildExportText(kind, list, fmt, detail, progress){
  if(fmt==='json') return JSON.stringify(list.map(x=> kind==='words'? wordObj(x,detail,progress) : sentObj(x,detail,progress)), null, 2);
  const header = kind==='words' ? wordHeader(detail,progress) : sentHeader(detail,progress);
  const rows = [header, ...list.map(x=> kind==='words'? wordRow(x,detail,progress) : sentRow(x,detail,progress))];
  if(fmt==='csv') return '\uFEFF' + toCSV(rows);
  if(fmt==='md') return '# 贸语通导出（' + todayKey() + '）\n\n' + mdTable(rows) + '\n';
  /* txt：纯词表 */
  return list.map(x=>{
    const a = kind==='words' ? x.term : x.en;
    const b = kind==='words' ? x.translation : x.zh;
    if(!detail) return a;
    const extra = kind==='words' && x.phonetic ? ' ' + x.phonetic : '';
    return a + extra + '\t' + b;
  }).join('\r\n');
}
const EXP_MIME = { csv:'text/csv', txt:'text/plain', md:'text/markdown', json:'application/json' };
function doExport(kind, list, fmt, detail, progress){
  if(!list.length){ toast('该范围内没有可导出的内容'); return; }
  const text = buildExportText(kind, list, fmt, detail, progress);
  download('tradelingo-' + kind + '-' + fmtDate(Date.now()) + '.' + fmt, text, (EXP_MIME[fmt]||'text/plain') + ';charset=utf-8');
  toast('已导出 ' + list.length + ' 条（' + fmt.toUpperCase() + '）');
}
function expRangeWords(){

  if(r==='star') return DB.words.filter(w=>w.starred);
  if(r==='wrong') return DB.words.filter(w=>w.wrongBook);
  if(r==='new') return DB.words.filter(w=>w.level<4);
  if(r==='mastered') return DB.words.filter(w=>w.level>=4);

/* 统一的输入解析：先按 JSON 解析（自动去 BOM / 代码块 / 外层包装），失败再按文本行解析 */
function parseImportText(text){
  const s = cleanText(text);
  const j = tryJSON(s);
  if(j!==undefined) return j;
  /* 看着像 JSON 却解析不了：直接报错，别把它当词表吞掉 */
  if(/^[{[]/.test(s)){
    let msg = '';
    try{ JSON.parse(sliceOuter(s)); }catch(e){ msg = e.message; }
    throw new Error('JSON 格式有误' + (msg ? '（' + msg + '）' : '：请检查逗号、引号与括号是否配对'));
  }
  return textToRaw(s);
}
function handleFile(f){
  if(!f) return;
  const name = String(f.name||'');
  if(/\.(xlsx|xls|xlsm)$/i.test(name)){
    importMsg(false, '暂不支持 Excel 原文件：请在 Excel 中「另存为 CSV（UTF-8）」后再导入，或让 AI 直接输出 JSON。');
    return;
  }
  if(f.size > 5*1024*1024){ importMsg(false, '文件超过 5MB，请拆分后再导入。'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = parseImportText(reader.result); }
    catch(e){ importMsg(false, '导入失败：'+e.message); return; }
    doImport(data);
  };
  reader.onerror = ()=>{ importMsg(false, '读取文件失败，请重试或改用「粘贴 JSON」。'); };
  reader.readAsText(f,'UTF-8');
}
function importPaste(){
  const el = document.getElementById('pasteArea');
  const text = ((el && el.value) || '').trim();
  if(!text){ importMsg(false, '请先粘贴 JSON 或词表内容'); return; }
  let data;
  try{ data = parseImportText(text); }
  catch(e){ importMsg(false, '导入失败：'+e.message); return; }
  doImport(data);
}
function doImport(input){
  try{
    const parsed = normalizeImport(input);
    if(parsed.words.length+parsed.sentences.length===0){
      importMsg(false, '导入失败：' + (parsed.hint || '未解析到有效的单词或句子条目'));
      return;
    }
    const r = applyImport(parsed);
    renderData(); updateTop();
    let m = `导入成功：新增 ${r.nw} 个单词、${r.ns} 个句子`;
    const skip = r.dup + r.dupS;
    if(skip) m += `；跳过 ${skip} 个已存在的条目`;
    if(r.withProgress) m += `；已保留 ${r.withProgress} 个词的学习进度`;
    importMsg(true, m);
  }catch(e){ importMsg(false, '导入失败：'+e.message); }
}
function download(filename, text, mime){
  const blob = new Blob([text], {type: mime || 'application/json;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function pushTrash(kind, item){
  if(!Array.isArray(DB.trash)) DB.trash = [];
  try{ DB.trash.unshift({ kind, item: JSON.parse(JSON.stringify(item)), at: Date.now() }); }catch(e){}
  pruneTrash();
}
function pruneTrash(){
  const cut = Date.now() - 30*86400000;
  DB.trash = (DB.trash||[]).filter(t=>t && t.at>cut).slice(0,200);
}
function restoreTrash(i){
  const t = DB.trash[i]; if(!t) return;
  const it = t.item || {};
  if(t.kind==='word'){
    if(DB.words.some(w=>w.id===it.id)) it.id = uid('w_');
    DB.words.unshift(it);
  }else{
    if(DB.sentences.some(s=>s.id===it.id)) it.id = uid('s_');
    DB.sentences.unshift(it);
  }
  DB.trash.splice(i,1);
  migrate(); saveDB(); updateTop(); render();
  toast('已从回收站恢复');
}
function purgeTrash(i){
  const t = DB.trash[i]; if(!t) return;
  const name = t.kind==='word' ? (t.item.term||'') : (t.item.en||'');
  if(!confirm('彻底删除「'+name+'」？删除后无法恢复。')) return;
  DB.trash.splice(i,1); saveDB(); render();
  toast('已彻底删除');
}
function emptyTrash(){
  if(!DB.trash.length) return;
  if(!confirm('清空回收站中的 '+DB.trash.length+' 项？删除后无法恢复。')) return;
  DB.trash = []; saveDB(); render();
  toast('回收站已清空');
}

/* ================= 自动快照 ================= */
const SNAP_KEY = 'tradelingo_snap_v1';
const SNAP_MAX = 3, SNAP_BYTES = 2200000;
function loadSnaps(){
  try{ const a = JSON.parse(localStorage.getItem(SNAP_KEY)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function writeSnaps(arr){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify(arr)); return true; }
  catch(e){ return false; }
}
/* 在导入、清空、回滚前调用，保存「当前状态」。体积超标时自动放弃，不阻断主流程 */
function makeSnapshot(label){
  try{
    const one = { at: Date.now(), label: label||'自动', wc: DB.words.length, sc: DB.sentences.length,
                  words: DB.words, sentences: DB.sentences };
    if(JSON.stringify(one).length > SNAP_BYTES) return { ok:false, reason:'too-big' };
    const snaps = loadSnaps();
    snaps.unshift(one);
    const kept = snaps.slice(0, SNAP_MAX);
    if(!writeSnaps(kept)){
      if(!writeSnaps([kept[0]])) return { ok:false, reason:'quota' };
      return { ok:true, n:1 };
    }
    return { ok:true, n:kept.length };
  }catch(e){ return { ok:false, reason:'error' }; }
}
function snapManual(){
  const r = makeSnapshot('手动');
  toast(r.ok ? '已创建快照' : (r.reason==='too-big' ? '词库过大，无法创建快照，请用「导出全部数据」备份' : '快照创建失败，浏览器存储空间可能已满'));
  renderData();
}
function rollbackSnap(i){
  const s = loadSnaps()[i];
  if(!s) return;
  if(!confirm('回滚到 '+fmtDate(s.at)+' 的快照？\n当前词库与句库将被替换为快照内的数据。')) return;
  makeSnapshot('回滚前');
  DB.words = JSON.parse(JSON.stringify(s.words||[]));
  DB.sentences = JSON.parse(JSON.stringify(s.sentences||[]));
  migrate(); saveDB(); updateTop();
  if(currentView==='data') renderData(); else render();
  toast('已回滚到 '+fmtDate(s.at)+' 的快照');
}
function delSnap(i){
  const snaps = loadSnaps();
  if(!snaps[i]) return;
  snaps.splice(i,1); writeSnaps(snaps); renderData(); toast('快照已删除');
}

/* 清空需要手动输入「清空」二字，避免误触 */
function clearAll(){ openClearModal(); }
function openClearModal(){
  document.getElementById('modalRoot').innerHTML = `
  <div class="modal-mask" onclick="if(event.target===this)closeModal()">
    <div class="modal" style="max-width:440px">
      <div class="modal-head"><h3>清空全部数据</h3><button class="modal-close" onclick="closeModal()">×</button></div>
      <div class="modal-body">
        <p style="font-size:13px;line-height:1.85;margin-bottom:16px">
          将删除 <b>${DB.words.length}</b> 个单词、<b>${DB.sentences.length}</b> 个句子，以及全部学习进度与测验记录。<br>
          系统会先自动创建一份快照，可在「备份与恢复」中回滚。</p>
        <div class="form-row">
          <div class="k">请输入 <b>清空</b> 两个字确认：</div>
          <input type="text" id="clearConfirmInput" placeholder="清空" autocomplete="off">
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
          <button class="btn ghost" onclick="closeModal()">取消</button>
          <button class="btn danger" onclick="doClearAll()">确认清空</button>
        </div>
      </div>
    </div>
  </div>`;
  const i = document.getElementById('clearConfirmInput'); if(i) i.focus();
}
function doClearAll(){
  const inp = document.getElementById('clearConfirmInput');
  if(!inp || inp.value.trim() !== '清空'){ toast('请输入「清空」两个字确认'); if(inp) inp.focus(); return; }
  makeSnapshot('清空前');
  DB = emptyDB(); saveDB(); closeModal(); updateTop();
  renderData();
  importMsg(true, '已清空。如需找回，可在「备份与恢复 → 自动快照」中回滚。');
}

    renderData(); updateTop();
    importMsg(true, `示例数据载入成功：+${r.nw} 词 / +${r.ns} 句`);
  }catch(e){ importMsg(false,'载入失败：'+e.message); }

/* ================= 键盘快捷键 ================= */
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(document.getElementById('modalRoot').innerHTML){ closeModal(); return; }
    if(listen && currentView==='words'){ stopListen(); return; }
    if(currentView==='quiz' && quiz){ confirmQuitQuiz(); return; }
    closeModal(); return;
  }
  if(document.getElementById('modalRoot').innerHTML) return;
  const tag = String((e.target && e.target.tagName) || '').toLowerCase();
  if(tag==='input' || tag==='textarea'){
    if(e.key==='Enter' && quiz && quiz.answered && currentView==='quiz'){ e.preventDefault(); nextQ(); }
    return;
  }
  if(currentView==='words' && listen){
    if(e.code==='Space'){ e.preventDefault(); listenToggle(); return; }
    if(e.key==='ArrowLeft'){ e.preventDefault(); listenStep(-1); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); listenStep(1); return; }
    return;
  }
  if(currentView==='words' && flash){
    if(e.code==='Space'){ e.preventDefault(); if(!flash.showZh) flipCard(); else gradeCard(1); return; }
    if(e.key==='1'){ e.preventDefault(); if(flash.showZh) gradeCard(-1); else flipCard(); return; }
    if(e.key==='2'){ e.preventDefault(); if(flash.showZh) gradeCard(0); return; }
    if(e.key==='3'){ e.preventDefault(); if(flash.showZh) gradeCard(1); return; }
    return;
  }
  if(currentView==='quiz' && quiz){
    const q = quiz.qs[quiz.idx];
    if(q && !quiz.answered && q.opts){
      const n = parseInt(e.key,10);
      if(n>=1 && n<=q.opts.length){ e.preventDefault(); answerOpt(n-1); }
      return;
    }
    if(quiz.answered && e.key==='Enter'){ e.preventDefault(); nextQ(); }
  }
});
